name: Build, Check, and Deploy EventHub

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment containing Azure deployment secrets
        required: true
        default: dev
      app_name:
        description: Azure Web App name override
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AZURE_WEBAPP_NAME: ${{ inputs.app_name || secrets.AZURE_WEBAPP_NAME }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python source
        run: python -m compileall -q eventhub events manage.py

      - name: Run Django checks
        run: python manage.py check

      - name: Run migrations check
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: .
