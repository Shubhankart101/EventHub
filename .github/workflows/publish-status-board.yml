name: Publish Pipeline Status Board

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Capture authenticated Actions snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            > site/status-data.json
          cp pipeline-tracker/index.html site/index.html
          cp -R docs/assets site/assets

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload status board
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy status board to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
