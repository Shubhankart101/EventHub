name: Publish Pipeline Status Board

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Capture authenticated Actions snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            > site/status-data.json
          cp pipeline-tracker/index.html site/index.html
          cp -R docs/assets site/assets

      - name: Verify GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          pages_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")

          if [ "${pages_status}" != "200" ]; then
            echo "::error::GitHub Pages is not enabled for ${GITHUB_REPOSITORY}. An administrator must open Settings > Pages, select GitHub Actions as the source, save, and rerun this workflow. GitHub API status: ${pages_status}."
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload status board
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy status board to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
